<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DiskInfo</title>
    <link rel="icon" href="/assets/icon.ico" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <symbol id="icon-drive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="6" rx="8" ry="3" />
          <path d="M4 6v12c0 1.66 3.58 3 8 3s8-1.34 8-3V6" stroke-linecap="round" />
          <path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" stroke-linecap="round" />
        </symbol>
        <symbol id="icon-health" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 12h4l2-6 4 12 2-6h6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="icon-partitions" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3.5" y="5" width="17" height="5.5" rx="1.2" />
          <rect x="3.5" y="13.5" width="10" height="5.5" rx="1.2" />
          <rect x="15.5" y="13.5" width="5" height="5.5" rx="1.2" />
        </symbol>
        <symbol id="icon-benchmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 15.5a8 8 0 1 1 16 0" stroke-linecap="round" />
          <path d="M12 15.5 16 9" stroke-linecap="round" />
          <circle cx="12" cy="15.5" r="1.1" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="8.5" />
          <path d="M12 11v5.5" stroke-linecap="round" />
          <circle cx="12" cy="7.7" r="0.9" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path
            d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M18 3v4h-4M6 21v-4h4" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M12 3.5v2.4M12 18.1v2.4M20.5 12h-2.4M5.9 12H3.5M17.7 6.3l-1.7 1.7M8 16l-1.7 1.7M17.7 17.7 16 16M8 8 6.3 6.3"
            stroke-linecap="round"
          />
        </symbol>
      </defs>
    </svg>

    <div class="app-shell">
      <nav class="sidebar">
        <div class="sidebar-brand">
          <img class="logo-mark" src="/assets/icon.ico" width="28" height="28" alt="" />
          <div class="brand-name">DiskInfo</div>
        </div>
        <ul class="nav-list" id="nav-list"></ul>
        <div class="sidebar-footer">
          <div class="theme-toggle" id="theme-toggle">
            <button data-theme-choice="light">Light</button>
            <button data-theme-choice="dark">Dark</button>
            <button data-theme-choice="system">System</button>
          </div>
          <div id="app-version">DiskInfo</div>
        </div>
      </nav>
      <main class="view-root" id="view-root"></main>
    </div>

    <script src="/js/nav-guard.js"></script>
    <script src="/vendor/chart.umd.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
